<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Recipeme!</title>
    <style>
      :root {
        --navbar-height: 60px;
        --safe-height: calc(100dvh - var(--navbar-height));
        --bg: linear-gradient(
          225deg,
          rgba(255, 255, 255) 0%,
          rgba(200, 200, 50, 0.6) 70%,
          rgba(0, 100, 200, 0.9) 100%
        );
        --btn-gradient: linear-gradient(
          225deg,
          rgba(255, 255, 255) 0%,
          rgba(200, 200, 50, 0.4) 30%,
          rgba(200, 200, 50, 0.4) 60%,
          rgba(0, 100, 200, 0.6) 100%
        );
        --btn-hover-gradient: linear-gradient(
          35deg,
          rgba(255, 255, 255) 0%,
          rgba(200, 200, 50, 0.4) 30%,
          rgba(200, 200, 50, 0.4) 60%,
          rgba(0, 100, 200, 0.6) 100%
        );
        --blue-accent: #3b82f6;
        --text-olive: rgb(99, 116, 6);
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        background: var(--bg);
        background-attachment: fixed;
        min-height: 100dvh;
        color: #333;
        overflow-x: hidden;
        display: flex;
      }

      /* --- קונטיינר מרכזי (דף הוספה/מתכון/חיפוש) --- */
      .page-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 85%;
        max-width: 500px;
        margin: 2rem auto;
        padding: 1.5rem;
        background-color: transparent;
        backdrop-filter: blur(5px);
        border-radius: 1rem;
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        border: 1px solid #93c5fd;
        text-align: center;
      }

      /* --- כפתורים (סגנון אחיד) --- */
      .button {
        height: 3rem;
        width: 100%;
        background: var(--btn-gradient);
        color: var(--text-olive);
        border-radius: 0.75rem;
        font-size: 1.2rem;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        margin: 0.5rem 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }

      .button:hover {
        background: var(--btn-hover-gradient);
        transform: scale(1.03);
        font-size: 1.3rem;
      }

      /* --- אינפוטים --- */
      .input,
      .textarea {
        width: 100%;
        padding: 0.75rem 1rem;
        margin: 0.5rem 0;
        border: 1px solid #ccc;
        border-radius: 0.75rem;
        font-size: 1rem;
        background: rgba(255, 255, 255, 0.7);
        box-sizing: border-box;
        outline: none;
        transition: all 0.3s ease;
      }

      .input:focus,
      .textarea:focus {
        border-color: var(--blue-accent);
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
        background: #fff;
      }

      .textarea {
        min-height: 120px;
        resize: none;
      }

      #ingredients-list {
        display: flex;
        flex-direction: column;
        /* gap: 10px; רווח בין אינפוט לאינפוט */
        width: 100%; /* תופס את כל רוחב הקונטיינר הלבן */
        margin: 10px 0;
      }

      /* --- דף הבית הספציפי --- */
      #view-home {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }

      .logo-home {
        height: 50vh;
        margin: 7vh auto 7vh auto;
        border-radius: 50%; /* הופך את התמונה לעיגול */
        object-fit: cover;
      }

      .search-group {
        display: flex;
        width: 85%;
        max-width: 500px;
        height: 3.5rem;
        margin-bottom: 1rem;
        border: 1px solid #5391f5; /* המסגרת עכשיו כאן */
        border-radius: 0.75rem;
        overflow: hidden; /* כדי שהפינות של האינפוט והכפתור לא יצאו מהמסגרת */
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.7);
      }

      /* כשהקבוצה בפוקוס (באמצעות focus-within) */
      .search-group:focus-within {
        border-color: #3b82f6;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        transform: scale(1.01);
      }

      .search-input {
        flex: 4;
        border: none !important; /* מבטל את המסגרת של האינפוט עצמו */
        border-radius: 0 !important;
        background: transparent !important;
        margin: 0 !important;
        height: 100%;
      }

      .search-button {
        flex: 1;
        border: none !important;
        border-right: 1px solid #5391f5; /* קו מפריד קטן בין האינפוט לכפתור */
        border-radius: 0 !important; /* הפינות מעוגלות כבר ע"י האבא */
        margin: 0 !important;
        height: 100%;
      }

      /* --- אנימציית טקסט רץ (Marquee) --- */
      .marquee-box {
        overflow: hidden;
        white-space: nowrap;
        width: 100%;
      }
      .marquee-box span {
        display: inline-block;
        padding-right: 100%;
        animation: marquee 8s linear infinite;
      }
      @keyframes marquee {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(100%);
        }
      }

      /* --- הודעות קופצות (Toast) --- */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 15%;
        transform: translate(-50%, 50px);
        background: rgba(255, 255, 255, 0.95);
        color: var(--blue-accent);
        border: 2px solid var(--blue-accent);
        padding: 1rem 2rem;
        border-radius: 2rem;
        font-weight: bold;
        opacity: 0;
        transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        z-index: 9999;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* עיצוב חלון המחיקה */
      .modal-overlay {
        display: none; /* מוסתר כברירת מחדל */
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6); /* רקע כהה ושקוף */
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }

      .modal-overlay.active {
        display: flex; /* מציג את החלון */
      }

      .modal-content {
        background: white;
        padding: 25px;
        border-radius: 12px;
        width: 85%;
        max-width: 320px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        animation: popIn 0.3s ease; /* אפקט כניסה יפה */
      }

      @keyframes popIn {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .modal-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        gap: 15px;
      }

      .modal-buttons .button {
        margin: 0;
        width: 100%;
      }

      /* --- תצוגות --- */
      .view {
        display: none !important;
      }

      /* רק ה-view שיש לו קלאס active יוצג */
      .view.active {
        display: flex !important;
        flex-direction: column;
        align-items: center;
        width: 100%;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
      }

      .label {
        width: 100%;
        text-align: right;
        font-weight: 600;
        color: #2563eb;
        margin-top: 0.5rem;
        margin-right: 2rem;
      }

      .backButton {
        position: fixed;
        /* top: calc(var(--safe-height) - 3rem); */
        top: var(--safe-height);
        left: calc(2.5% + 0.5rem);

        height: 2.5rem;
        width: 10%;

        background: linear-gradient(
          225deg,
          #ffffff 0%,
          #d6d662 30%,
          #4d91c2 100%
        );
        /* color: rgb(99, 116, 6); */
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        border-radius: 0.75rem;
        font-size: 100%;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin: 0.5rem auto;
        z-index: 1000;
      }

      .backButton:hover {
        background: linear-gradient(
          35deg,
          #ffffff 0%,
          #d6d662 30%,
          #d6d662 60%,
          #4d91c2 100%
        );

        font-size: 120%;
        transform: scale(1.02);
      }

      /* אנימציית סגירה - נגלל מלמטה למעלה */
      @keyframes rollUpScroll {
        0% {
          clip-path: inset(0 0 0 0); /* הדף מוצג במלואו */
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          clip-path: inset(0 0 100% 0); /* החלק התחתון נחתך עד למעלה */
          opacity: 0;
          transform: translateY(-20px); /* משיכה קלה למעלה */
        }
      }

      /* אנימציית פתיחה - נגלל מלמעלה למטה */
      @keyframes rollDownScroll {
        0% {
          clip-path: inset(0 0 100% 0); /* הדף מוסתר למעלה */
          opacity: 0;
          transform: translateY(-20px);
        }
        100% {
          clip-path: inset(0 0 0 0); /* הדף נחשף במלואו */
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* קלאסים שיורצו על ידי ה-JavaScript */
      .view-closing {
        /* תנועה מהירה יחסית בסגירה */
        animation: rollUpScroll 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
      }

      .view-opening {
        /* תנועה חלקה עם קפיצה קטנטנה (Bounce) בסוף הפתיחה */
        animation: rollDownScroll 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)
          forwards !important;
      }
    </style>
  </head>
  <body>
    <div id="toast">הודעה</div>

    <div id="view-home" class="view active">
      <img src="/icon.png" class="logo-home" alt="Logo" />
      <div class="search-group">
        <input
          type="text"
          id="search-input"
          class="input search-input"
          placeholder="חפש מתכון..."
        />
        <button class="button search-button" onclick="searchRecipes()">
          🔍
        </button>
      </div>
      <button
        class="button"
        style="width: 85%; max-width: 500px"
        onclick="showView('view-add')"
      >
        הוספת מתכון חדש
      </button>
    </div>

    <div id="view-search" class="view">
      <div class="page-container">
        <h2 style="color: var(--blue-accent)">תוצאות חיפוש</h2>
        <div id="search-results" style="width: 100%"></div>
      </div>
      <button class="backButton" onclick="goHome()">חזור</button>
    </div>

    <div id="view-add" class="view">
      <div class="page-container">
        <h2
          id="form-title"
          class="label"
          style="text-align: center; font-size: 1.5rem; margin-right: 0"
        >
          הוספת מתכון
        </h2>

        <div class="label">שם המתכון</div>
        <input
          type="text"
          id="recipe-name"
          class="input"
          placeholder="למשל: עוגת שוקולד"
        />

        <div class="label">מצרכים</div>
        <div id="ingredients-list"></div>

        <div class="label">אופן ההכנה</div>
        <textarea
          id="recipe-method"
          class="textarea"
          placeholder="איך מכינים?"
        ></textarea>

        <button class="button" id="save-btn" onclick="saveRecipe()">
          שמור מתכון
        </button>
        <button class="button" onclick="goHome()">ביטול</button>
      </div>
    </div>

    <div id="view-recipe" class="view">
      <div
        class="page-container"
        style="text-align: right; align-items: flex-start"
      >
        <h1
          id="display-name"
          style="color: var(--blue-accent); width: 100%; text-align: center"
        ></h1>

        <div class="label">מצרכים:</div>
        <ul id="display-ingredients" style="padding-right: 2rem"></ul>

        <div class="label">אופן הכנה:</div>
        <p
          id="display-method"
          style="line-height: 1.6; white-space: pre-wrap; padding-right: 2rem"
        ></p>

        <button
          class="button"
          style="color: #b91c1c"
          onclick="
            askDeleteRecipe(document.getElementById('display-name').innerText)
          "
        >
          מחיקת מתכון
        </button>
        <button class="button" style="color: #333" onclick="goHome()">
          חזור לדף הבית
        </button>
      </div>
    </div>

    <div id="delete-modal" class="modal-overlay" onclick="closeDeleteModal()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <h3 style="color: #ef4444; margin-top: 0">מחיקת מתכון</h3>
        <p>האם אתה בטוח שברצונך למחוק מתכון זה לצמיתות?</p>
        <div class="modal-buttons">
          <button class="button" style="color: #ef4444" id="confirm-delete-btn">
            כן, מחק
          </button>
          <button class="button" onclick="closeDeleteModal()">ביטול</button>
        </div>
      </div>
    </div>

    <script>
      const API_URL =
        "https://script.google.com/macros/s/AKfycbyg7jQ1hnPkzT-yBVJfUbluXyMToMvS06ezUNXHM985po1PyiVccNKf3oeMSDLsxdIT/exec";
      let currentRecipe = null;

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 3000);
      }

      function showView(viewId) {
        const currentActive = document.querySelector(".view.active");
        const targetView = document.getElementById(viewId);

        // אם אנחנו כבר בדף המבוקש, אל תעשה כלום
        if (currentActive === targetView) return;

        if (currentActive) {
          // 1. מפעילים את אנימציית הגלגול כלפי מעלה על הדף הנוכחי
          currentActive.classList.add("view-closing");

          // 2. ממתינים 400 מילישניות (זמן אנימציית הסגירה) לפני החלפת הדפים
          setTimeout(() => {
            // מסירים את הדף הישן מהתצוגה
            currentActive.classList.remove("active", "view-closing");

            // מכינים את הדף החדש עם הפתיחה מלמעלה למטה
            targetView.classList.add("active", "view-opening");
            window.scrollTo(0, 0); // מוודאים שהמסך למעלה

            // 3. מנקים את קלאס הפתיחה כשהיא מסתיימת (אחרי 500 מילישניות)
            setTimeout(() => {
              targetView.classList.remove("view-opening");
            }, 500);
          }, 400); // 400ms = הזמן שלוקח לדף להסגר
        } else {
          // מקרה קצה לטעינה ראשונית של האפליקציה (כשאין עדיין אף דף פעיל)
          targetView.classList.add("active", "view-opening");
          setTimeout(() => targetView.classList.remove("view-opening"), 500);
        }
      }

      function goHome() {
        // 1. ניקוי שדה החיפוש
        const searchInput = document.getElementById("search-input");
        if (searchInput) {
          searchInput.value = "";
        }

        // 2. איפוס הגדרות דף ההוספה (למקרה שהיינו בעריכה)
        const recipeNameInput = document.getElementById("recipe-name");
        if (recipeNameInput) {
          recipeNameInput.disabled = false;
          recipeNameInput.value = "";
        }

        document.getElementById("recipe-method").value = "";
        document.getElementById("form-title").innerText = "הוספת מתכון";
        document.getElementById("save-btn").innerText = "שמור מתכון";

        // 3. איפוס רשימת המצרכים
        groceryList = [""];
        renderIngredients();

        // 4. מעבר לדף הבית
        showView("view-home");
      }

      async function searchRecipes() {
        const query = document.getElementById("search-input").value;
        showToast("מחפש...");
        try {
          const res = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "getRecipes", query }),
          });
          const result = await res.json();
          const list = document.getElementById("search-results");
          list.innerHTML = "";

          if (result.data.length === 0) {
            list.innerHTML = "<p>לא נמצאו מתכונים</p>";
            console.log(result);
          }

          result.data.forEach((name) => {
            const b = document.createElement("button");
            b.className = "button";
            if (name.length > 20) {
              b.innerHTML = `<div class="marquee-box"><span>${name}</span></div>`;
            } else {
              b.innerText = name;
            }
            b.onclick = () => loadRecipe(name);
            list.appendChild(b);
          });
          showView("view-search");
        } catch (e) {
          showToast("שגיאה בחיבור");
        }
      }

      async function loadRecipe(name) {
        showToast("טוען מתכון...");
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getRecipeDetails", name }),
        });
        const result = await res.json();
        currentRecipe = result.data;

        document.getElementById("display-name").innerText = currentRecipe.name;
        document.getElementById("display-ingredients").innerHTML =
          currentRecipe.ingredients.map((i) => `<li>${i}</li>`).join("");
        document.getElementById("display-method").innerText =
          currentRecipe.method;
        showView("view-recipe");
      }

      async function saveRecipe() {
        const nameInput = document.getElementById("recipe-name");
        const methodInput = document.getElementById("recipe-method");

        const name = nameInput.value.trim();
        const method = methodInput.value.trim();
        // לקיחת המצרכים מהמערך וניקוי שדות ריקים
        const ingredients = groceryList.filter((item) => item.trim() !== "");

        if (!name || !method || ingredients.length === 0) {
          showToast("חובה למלא שם, מצרכים ואופן הכנה");
          return;
        }

        const saveBtn = document.getElementById("save-btn");
        const isUpdate = saveBtn.innerText === "אישור";
        const action = isUpdate ? "updateRecipe" : "addRecipe";

        // שינוי מצב כפתור ומניעת לחיצות כפולות
        saveBtn.disabled = true;
        showToast(isUpdate ? "מעדכן מתכון..." : "שומר מתכון חדש...");

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: action,
              recipe: { name, ingredients, method },
            }),
          });

          const result = await response.json();

          if (result.status === "success") {
            showToast(
              isUpdate ? "המתכון עודכן בהצלחה!" : "המתכון נשמר בהצלחה!",
            );

            // המתן שנייה אחת כדי שהמשתמש יראה את הודעת ההצלחה, ואז העבר דף
            setTimeout(() => {
              saveBtn.disabled = false;
              loadRecipe(name); // טעינת המתכון לתצוגה
            }, 1000);
          } else {
            showToast("שגיאה מהשרת: " + result.message);
            saveBtn.disabled = false;
          }
        } catch (error) {
          console.error("Save error:", error);
          showToast("שגיאה בחיבור לשרת. בדוק את האינטרנט.");
          saveBtn.disabled = false;
        }
      }

      // מערך גלובלי לניהול המצרכים (כמו ה-State ב-React)
      let groceryList = [""]; // המערך שמחזיק את המצרכים

      function renderIngredients() {
        const container = document.getElementById("ingredients-list");
        if (!container) return;
        container.innerHTML = "";

        groceryList.forEach((item, index) => {
          createIngredientInput(index, item);
        });
      }

      function createIngredientInput(index, value) {
        const container = document.getElementById("ingredients-list");
        const input = document.createElement("input");
        input.type = "text";
        input.className = "input ing-input";
        input.value = value;
        input.placeholder = index === 0 ? "הוסף מצרך ראשון" : "הוסף מצרך נוסף";

        // אירוע הקלדה - הוספת שדה חדש ברגע שמתחילים לכתוב באחרון
        input.oninput = (e) => {
          groceryList[index] = e.target.value;

          // אם זה האינפוט האחרון והוא כבר לא ריק -> תוסיף שדה חדש למערך ול-DOM
          if (
            index === groceryList.length - 1 &&
            e.target.value.trim() !== ""
          ) {
            const nextIndex = groceryList.length;
            groceryList.push("");
            createIngredientInput(nextIndex, ""); // מוסיף ל-DOM בלי לרנדר מחדש הכל
          }
        };

        // ניהול מקשים: אנטר וטאב
        input.onkeydown = (e) => {
          if (e.key === "Enter" || e.key === "Tab") {
            // אם לחצנו אנטר, נמנע שליחת טופס
            if (e.key === "Enter") e.preventDefault();

            const allInputs = container.querySelectorAll(".ing-input");
            // אם יש אינפוט הבא - תעבור אליו
            if (allInputs[index + 1]) {
              allInputs[index + 1].focus();
            } else if (e.key === "Enter" && input.value.trim() !== "") {
              // מקרה קצה: אם אנטר נלחץ והשדה האחרון מלא אבל האינפוט עוד לא נוצר
              setTimeout(() => {
                const updatedInputs = container.querySelectorAll(".ing-input");
                if (updatedInputs[index + 1]) updatedInputs[index + 1].focus();
              }, 10);
            }
          }
        };

        // ניקוי שדות ריקים ביציאה (Blur)
        input.onblur = (e) => {
          const val = e.target.value.trim();
          groceryList[index] = val;

          // אם השדה ריק, הוא לא האחרון, ויש יותר משדה אחד - נמחק אותו
          if (
            val === "" &&
            index !== groceryList.length - 1 &&
            groceryList.length > 1
          ) {
            groceryList.splice(index, 1);
            renderIngredients(); // כאן מותר לרנדר מחדש כי המשתמש סיים עם השדה
          }
        };

        container.appendChild(input);
      }

      // פונקציית מעבר דפים מתוקנת
      function showView(viewId) {
        // 1. הסתרת כל הדפים
        const allViews = document.querySelectorAll(".view");
        allViews.forEach((v) => {
          v.classList.remove("active");
        });

        // 2. הצגת הדף המבוקש
        const targetView = document.getElementById(viewId);
        if (targetView) {
          targetView.classList.add("active");
        }

        // 3. גלילה לראש העמוד
        window.scrollTo(0, 0);
      }

      // הרצה ראשונית של האינפוטים כשהדף עולה
      window.onload = () => {
        renderIngredients();

        const searchInput = document.getElementById("search-input");
        if (searchInput) {
          searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault(); // מונע רענון של הדף
              searchRecipes(); // מפעיל את פונקציית החיפוש שכבר קיימת
            }
          });
        }
      };

      let recipeToDelete = ""; // משתנה גלובלי שיזכור איזה מתכון אנחנו רוצים למחוק

      // 1. פונקציה שמקפיצה את ההודעה (קרא לה מהכפתור "מחק" בדף המתכון)
      function askDeleteRecipe(recipeName) {
        recipeToDelete = recipeName;

        document.getElementById("delete-modal").classList.add("active");
      }

      // 2. פונקציה שסוגרת את ההודעה (מופעלת בלחיצה מחוץ לחלון או על "ביטול")
      function closeDeleteModal() {
        document.getElementById("delete-modal").classList.remove("active");
        recipeToDelete = ""; // מנקים את המשתנה ליתר ביטחון
      }

      // 3. אירוע לחיצה על כפתור "כן, מחק" בתוך ההודעה
      document.getElementById("confirm-delete-btn").onclick = async () => {
        if (!recipeToDelete) return;

        // מיד נסגור את החלון ונראה טוסט
        document.getElementById("delete-modal").classList.remove("active");
        showToast("מוחק מתכון...");

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "deleteRecipe",
              name: recipeToDelete,
            }),
          });
          const result = await res.json();

          if (result.status === "success") {
            showToast("המתכון נמחק בהצלחה!");
            setTimeout(() => goHome(), 1000); // חזרה לדף הבית אחרי המחיקה
          } else {
            showToast("שגיאה: " + result.message);
          }
        } catch (e) {
          showToast("שגיאה בחיבור לשרת");
        }
      };
    </script>
  </body>
</html>
