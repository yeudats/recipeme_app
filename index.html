<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Recipeme!</title>
    <style>
      :root {
        /* צבעים עדינים יותר */
        --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        --btn-gradient: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        --btn-hover-gradient: linear-gradient(135deg, #fda085 0%, #f6d365 100%);
        --blue-accent: #3b82f6;
        --text-main: #334155;
        --container-bg: rgba(255, 255, 255, 0.85);

        /* אינפוטים לקריאה בלבד בדף מתכון */
        --readonly-bg: #e0f2fe;
        --readonly-text: #475569;
        --readonly-border: #bae6fd;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        background: var(--bg-gradient);
        background-attachment: fixed;
        min-height: 100dvh;
        color: var(--text-main);
        overflow-x: hidden;
        /* display: flex; */
        user-select: none; /* מונע בחירת טקסט בכל האתר */
        -webkit-user-select: none;
        overflow-x: hidden; /* מונע קפיצות רוחב בגלל אלמנטים שיוצאים מהמסך */
  position: relative;
  display: block;
      }

      /* קונטיינר מרכזי - עם מרווחים מהצדדים ולמטה */
      .page-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 85%;
        max-width: 500px;
        margin: 2rem auto 2rem auto; /* מרווח מלמעלה ומלמטה */
        padding: 1.5rem;
        background-color: var(--container-bg);
        backdrop-filter: blur(8px);
        border-radius: 1.2rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.5);
        text-align: center;
        box-sizing: border-box;
        position: relative;
      }

      /* כפתורים */
      .button {
        height: 3rem;
        width: 100%;
        background: var(--btn-gradient);
        color: #fff;
        border-radius: 0.75rem;
        font-size: 1.2rem;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        margin: 0.5rem 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        position: relative; /* לתיקון לחיצות */
        z-index: 10;
      }

      .button:hover,
      .button:active {
        transform: scale(1.02);
        box-shadow: 0 4px 12px rgba(253, 160, 133, 0.4);
      }

      /* אינפוטים */
      .input,
      .textarea {
        width: 100%;
        padding: 0.75rem 1rem;
        margin: 0.5rem 0;
        border: 1px solid #cbd5e1;
        border-radius: 0.75rem;
        font-size: 1rem;
        background: #fff;
        box-sizing: border-box;
        outline: none;
        transition: all 0.3s ease;
        user-select: auto; /* מאפשר סימון טקסט בתוך אינפוטים */
        -webkit-user-select: auto;
        font-family: inherit;
      }

      .input:focus,
      .textarea:focus {
        border-color: var(--blue-accent);
        background: #f0f9ff; /* הופך לתכלת עדין */
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      .textarea {
        min-height: 120px;
        resize: none;
        overflow: hidden; /* מבטל את הגלילה הפנימית */
        transition: height 0.1s ease; /* אנימציה עדינה להגדלה */
        line-height: 1.5;
      }

      /* אינפוטים של קריאה בלבד (דף מתכון) */
      .readonly-box {
        background-color: var(--readonly-bg);
        color: var(--readonly-text);
        border: 1px solid var(--readonly-border);
        pointer-events: none; /* חוסם לחיצה/פוקוס */
        text-align: right;
      }

      #ingredients-list {
        display: flex;
        flex-direction: column;
        width: 100%;
        margin: 5px 0;
      }

      #display-ingredients {
        width: 100%;
        padding: 0;
        margin: 0.5rem 0;
        list-style: none; /* מבטל את הנקודות הרגילות אם תרצה */
        text-align: right; /* מצמיד טקסט לימין */
        direction: rtl; /* מבטיח כיוון עברית */
      }

      #display-ingredients li {
        margin-bottom: 0.5rem;
        padding: 0.4rem 0;
        display: block; /* גורם לכל מצרך לתפוס שורה מלאה כמו אינפוט */
        box-sizing: border-box;
      }

      #display-ingredients li::before {
        content: "🔪 ";
        margin-left: 8px;
      }

      .label {
        width: 100%;
        text-align: right;
        font-weight: 600;
        color: var(--blue-accent);
        margin-top: 0.8rem;
        font-size: 1.1rem;
      }

      /* --- דף הבית --- */
      #view-home {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 5vh;
      }

      .logo-home {
        width: 250px;
        height: 250px;
        margin: 5dvh auto 20dvh auto;
        border-radius: 50%;
        object-fit: cover;
        /* box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); */
        /* אם אין תמונה, מציג עיגול אפור יפה כפלייסחולדר */
        /* background-color: #e2e8f0; */
      }

      .search-group {
        display: flex;
        width: 85%;
        max-width: 500px;
        height: 3.5rem;
        margin-bottom: 1.5rem;
        border: 2px solid #93c5fd;
        border-radius: 0.75rem;
        overflow: hidden;
        background: #fff;
        transition: all 0.3s ease;
      }

      .search-group:focus-within {
        border-color: var(--blue-accent);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      .search-input {
        flex: 4;
        border: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        height: 100%;
      }

      .search-input:focus {
        outline: none;
        background-color: #fbfdff;
      }

      .search-button {
        flex: 1;
        border: none !important;
        border-right: 1px solid #bfdbfe;
        border-radius: 0 !important;
        margin: 0 !important;
        height: 100%;
        background: #eff6ff;
        color: var(--blue-accent);
      }

      /* --- אנימציית טקסט רץ (Marquee) עם השהייה של 2 שניות --- */
      .marquee-container {
        width: calc(100% - 20px);
        overflow: hidden;
        white-space: nowrap;
        position: relative;
        padding: 0 10px;
      }

      .marquee-text {
        display: inline-block;
        animation: marquee 7s linear infinite;
        animation-delay: 2s; /* מחכה 2 שניות לפני שמתחיל */
      }

      @keyframes marquee {
        0%,
        10% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(100%);
        }
      }

      /* --- הודעות קופצות (Toast) --- */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 2rem;
        transform: translate(-50%, 50px);
        background: rgba(15, 23, 42, 0.9);
        color: #fff;
        padding: 0.8rem 1.5rem;
        border-radius: 2rem;
        font-weight: 500;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        z-index: 9999;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* חלון מחיקה */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(3px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .modal-overlay.active {
        display: flex;
        opacity: 1;
      }
      .modal-content {
        background: white;
        padding: 25px;
        border-radius: 12px;
        width: 85%;
        max-width: 320px;
        text-align: center;
        transform: scale(0.9);
        transition: transform 0.3s ease;
      }
      .modal-overlay.active .modal-content {
        transform: scale(1);
      }

      /* --- דף טעינה עם אנימציה --- */
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100dvh;
      }
      .cooking-pot {
        width: 60px;
        height: 40px;
        background: #475569;
        border-radius: 0 0 20px 20px;
        position: relative;
        animation: bouncePot 1s infinite alternate;
      }
      .cooking-pot::before {
        content: "";
        position: absolute;
        top: -10px;
        left: 10px;
        width: 40px;
        height: 10px;
        background: #94a3b8;
        border-radius: 50%;
      }
      .cooking-pot::after {
        content: "";
        position: absolute;
        top: 10px;
        right: -25px;
        width: 30px;
        height: 8px;
        background: #475569;
        border-radius: 10px;
        transform: rotate(20deg);
      }
      @keyframes bouncePot {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-10px);
        }
      }
      .loader-text {
        margin-top: 1.5rem;
        color: var(--blue-accent);
        font-weight: bold;
        font-size: 1.2rem;
      }

      /* --- תצוגות (Views) - מעברי שקיפות (Fade) --- */
      .view {
  display: none;
  opacity: 0;
  width: 100%;
  min-height: 100dvh;
  transition: opacity 2s ease-in-out;
  /* מרכוז אבסולוטי קשיח */
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  margin-left: auto;
  margin-right: auto;
  
  flex-direction: column;
  align-items: center;
  pointer-events: none;
  z-index: 1;
}

.view.active {
  display: flex;
  opacity: 1;
  pointer-events: auto;
  z-index: 2;
  /* השארת המיקום כאבסולוטי כדי שלא יקפוץ כשנוסיף דף אחר */
  position: relative; 
}

/* במצב של דעיכה, אנחנו מכריחים אותו להישאר אבסולוטי מעל הכל */
.view.fading-out {
  display: flex;
  opacity: 0;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 10; 
}
    </style>
  </head>
  <body>
    <div id="toast">הודעה</div>

    <div id="delete-modal" class="modal-overlay" onclick="closeDeleteModal()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <h3 style="color: #ef4444; margin-top: 0">מחיקת מתכון</h3>
        <p>האם למחוק את המתכון לצמיתות?</p>
        <div style="display: flex; gap: 15px; margin-top: 20px">
          <button
            class="button"
            style="background: #ef4444"
            id="confirm-delete-btn"
          >
            כן, מחק
          </button>
          <button
            class="button"
            style="background: #94a3b8"
            onclick="closeDeleteModal()"
          >
            ביטול
          </button>
        </div>
      </div>
    </div>

    <div id="view-loading" class="view">
      <div class="loader-container">
        <div class="cooking-pot"></div>
        <div class="loader-text"></div>
      </div>
    </div>

    <div id="view-home" class="view active">
      <img
        src="/icon.png"
        class="logo-home"
        alt="Logo"
        onerror="this.style.display = 'none'"
      />

      <div class="search-group">
        <input
          type="text"
          id="search-input"
          class="input search-input"
          placeholder="חפש מתכון..."
        />
        <button
          class="button search-button"
          onclick="
            searchRecipes(document.getElementById('search-input').value.trim());
            setTimeout(() => {document.getElementById('search-input').value = '';}, 750);
          "
        >
          🔍
        </button>
      </div>

      <button
        class="button"
        style="width: 85%; max-width: 500px"
        onclick="
          resetAddForm();
          navigateTo('view-add', false);
        "
      >
        הוספת מתכון חדש
      </button>
    </div>

    <div id="view-search" class="view">
      <div class="page-container">
        <h2 style="color: var(--blue-accent)">תוצאות חיפוש</h2>
        <div id="search-results" style="width: 100%"></div>
      </div>
    </div>

    <div id="view-add" class="view">
      <div class="page-container">
        <h2 class="label" style="text-align: center; font-size: 1.5rem">
          הוספת מתכון חדש
        </h2>

        <div class="label">שם המתכון</div>
        <input
          type="text"
          id="recipe-name"
          class="input"
          placeholder="למשל: עוגת שוקולד"
        />

        <div class="label">מצרכים</div>
        <div id="ingredients-list"></div>

        <div class="label">אופן ההכנה</div>
        <textarea
          id="recipe-method"
          class="textarea"
          placeholder="איך מכינים?"
          oninput="autoResize(this)"
        ></textarea>

        <button class="button" id="save-btn" onclick="saveRecipe()">
          שמור מתכון
        </button>
      </div>
    </div>

    <div id="view-recipe" class="view">
      <div class="page-container">
        <h1
          id="display-name"
          style="
            color: var(--blue-accent);
            text-align: center;
            width: 100%;
            margin-top: 0;
          "
        ></h1>

        <div class="label">מצרכים</div>
        <ul id="display-ingredients"></ul>

        <div class="label">אופן ההכנה</div>
        <textarea
          id="display-method"
          class="textarea readonly-box"
          readonly
        ></textarea>

        <button
          class="button"
          style="background: #ef4444; margin-top: 1.5rem"
          onclick="askDeleteRecipe()"
        >
          מחיקת מתכון
        </button>
      </div>
    </div>

    <script>
      // ⚠️ החלף את הלינק הזה ללינק החדש של השרת שלך לאחר העדכון! ⚠️
      const API_URL =
        "https://script.google.com/macros/s/AKfycbyg7jQ1hnPkzT-yBVJfUbluXyMToMvS06ezUNXHM985po1PyiVccNKf3oeMSDLsxdIT/exec";

      // שמירת תוצאות החיפוש בזיכרון של הפרונט
      let cachedRecipes = [];
      let currentRecipeName = "";
      let groceryList = [""];

      /* --- ניהול היסטוריה וניווט (History API) --- */
      window.onload = () => {
        // אתחול ההיסטוריה לדף הבית
        // history.replaceState({ view: "view-home" }, "", "#home");
        // renderIngredients();
        navigateTo("view-home", true);

        const searchInput = document.getElementById("search-input");
        if (searchInput) {
          searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              searchRecipes(searchInput.value.trim());
              document.getElementById("search-input").value = "";
            }
          });
        }
      };

      // המאזין שלוחץ על ה"חזור" בפלאפון או בדפדפן
      window.onpopstate = (e) => {
        if (
          document.getElementById("delete-modal").classList.contains("active")
        ) {
          closeDeleteModal();
          return;
        }

        if (e.state && e.state.view) {
          switchViewElement(e.state.view);
        } else {
          switchViewElement("view-home");
        }
      };

      function navigateTo(viewId, replace = false) {
        if (replace) {
          history.replaceState(
            { view: viewId },
            "",
            `#${viewId.replace("view-", "")}`,
          );
        } else {
          history.pushState(
            { view: viewId },
            "",
            `#${viewId.replace("view-", "")}`,
          );
        }
        switchViewElement(viewId);
      }

      function resetAddForm() {
        document.getElementById("recipe-name").value = "";
        document.getElementById("recipe-method").value = "";
        document.getElementById("recipe-method").style.height = "auto"; // איפוס גובה
        groceryList = [""];
        renderIngredients();
      }

      function switchViewElement(viewId) {
        const currentView = document.querySelector(".view.active");
        const nextView = document.getElementById(viewId);

        // אם יש דף שמוצג כרגע, נעלים אותו קודם
        if (currentView && currentView.id !== viewId) {
          currentView.classList.add("fading-out");
          currentView.classList.remove("active");

          // מחכים 2 שניות (2000 מילישניות) לפני שמציגים את הבא
          setTimeout(() => {
            currentView.classList.remove("fading-out");
            currentView.style.display = "none"; // מבטיח הסרה מוחלטת

            showNextView(nextView, viewId);
          }, 750);
        } else {
          // אם זה המעבר הראשון (טעינת דף)
          showNextView(nextView, viewId);
        }
      }

      function showNextView(nextView, viewId) {
        nextView.style.display = "flex";
        // Trigger reflow כדי שהדפדפן יזהה את שינוי ה-display לפני ה-opacity
        void nextView.offsetWidth;

        nextView.classList.add("active");
        window.scrollTo(0, 0);

        // תיקון גובה ל-textarea אם עברנו לדף מתכון
        if (viewId === "view-recipe") {
          setTimeout(
            () => autoResize(document.getElementById("display-method")),
            50,
          );
        }
      }

      /* --- פונקציות עזר --- */
      function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 3000);
      }

      function createMarqueeText(text) {
        if (text.length > 20) {
          return `<div class="marquee-container"><span class="marquee-text">${text}</span></div>`;
        }
        return text;
      }

      /* --- תקשורת לשרת והצגת נתונים --- */
      async function searchRecipes(query) {
        navigateTo("view-loading", false); // מעבר לדף טעינה

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "getRecipes", query }),
          });
          const result = await res.json();

          cachedRecipes = result.data; // שמירת כל הנתונים בזיכרון
          const list = document.getElementById("search-results");
          list.innerHTML = "";

          if (cachedRecipes.length === 0) {
            list.innerHTML = "<p style='color: #64748b;'>לא נמצאו מתכונים</p>";
          } else {
            cachedRecipes.forEach((recipe, index) => {
              const b = document.createElement("button");
              b.className = "button";
              b.innerHTML = createMarqueeText(recipe.name);
              // לחיצה טוענת מיד מהזיכרון
              b.onclick = () => {
                renderRecipeFromCache(index);
                navigateTo("view-recipe", false);
              };
              list.appendChild(b);
            });
          }
          // במקום להחליף את ההיסטוריה, נוסיף כדי שיהיה אפשר לחזור לחיפוש
          navigateTo("view-search", true);
        } catch (e) {
          showToast("שגיאה בחיבור");
          history.back(); // חזור לדף הקודם
        }
      }

      // טעינת מתכון ללא קריאת שרת! המידע כבר אצלנו
      function renderRecipeFromCache(index) {
        const recipe = cachedRecipes[index];

        currentRecipeName = recipe.name;

        // שם מתכון ככותרת עליונה
        document.getElementById("display-name").innerHTML = createMarqueeText(
          recipe.name,
        );

        // מצרכים כתיבות קריאה בלבד
        document.getElementById("display-ingredients").innerHTML =
          recipe.ingredients.map((i) => `<li>${i}</li>`).join("");

        // אופן הכנה
        document.getElementById("display-method").value = recipe.method;
        // autoResize(document.getElementById("display-method"));

        // navigateTo("view-recipe", false);
      }

      async function saveRecipe() {
        const name = document.getElementById("recipe-name").value.trim();
        const method = document.getElementById("recipe-method").value.trim();
        const ingredients = groceryList.filter((item) => item.trim() !== "");

        if (!name || !method || ingredients.length === 0) {
          showToast("חובה למלא שם, מצרכים ואופן הכנה");
          return;
        }

        const saveBtn = document.getElementById("save-btn");
        saveBtn.disabled = true;
        navigateTo("view-loading", true); // מעבר לדף טעינה

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "addRecipe",
              recipe: { name, ingredients, method },
            }),
          });
          const result = await response.json();

          if (result.status === "success") {
            showToast("המתכון נשמר בהצלחה!");

            // שומרים את המתכון החדש לקאש המקומי כדי להציג אותו מיד
            cachedRecipes = [{ name, ingredients, method }];

            setTimeout(() => {
              saveBtn.disabled = false;
              // הדרישה: חזרה מדף מתכון חדש תחזיר לבית. לכן נעשה ReplaceState
              //   history.replaceState({ view: "view-home" }, "", "#home");

              //   history.pushState({ view: "view-recipe" }, "", "#recipe");
              renderRecipeFromCache(0);
              navigateTo("view-recipe", true);
            }, 1000);
          } else {
            showToast("שגיאה מהשרת: " + result.message);
            saveBtn.disabled = false;
            // history.back();
            navigateTo("view-add", true);
          }
        } catch (error) {
          showToast("שגיאה בחיבור לשרת");
          saveBtn.disabled = false;
          // history.back();
          navigateTo("view-add", true);
        }
      }

      /* --- טיפול במחיקה --- */
      function askDeleteRecipe() {
        document.getElementById("delete-modal").classList.add("active");
      }

      function closeDeleteModal() {
        document.getElementById("delete-modal").classList.remove("active");
      }

      document.getElementById("confirm-delete-btn").onclick = async () => {
        closeDeleteModal();
        navigateTo("view-loading", true);

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "deleteRecipe",
              name: currentRecipeName,
            }),
          });
          const result = await res.json();

          if (result.status === "success") {
            showToast("המתכון נמחק");
            setTimeout(() => {
              // חוזרים דף אחד אחורה בהיסטוריה (אמור להיות החיפוש או הבית)
              //   history.back();
              navigateTo("view-home", true);
              window.location.href = "#home";
            }, 1000);
          } else {
            showToast("שגיאה: " + result.message);
            // history.back();
            navigateTo("view-recipe", true);
          }
        } catch (e) {
          showToast("שגיאה בחיבור לשרת");
          // history.back();
          navigateTo("view-recipe", true);
        }
      };

      /* --- ניהול רשימת המצרכים בדיוק כמו שהיה, רק ללא רינדור מחדש הורס פוקוס --- */
      function renderIngredients() {
        const container = document.getElementById("ingredients-list");
        container.innerHTML = "";
        groceryList.forEach((item, index) =>
          createIngredientInput(index, item),
        );
      }

      function createIngredientInput(index, value) {
        const container = document.getElementById("ingredients-list");
        const input = document.createElement("input");
        input.type = "text";
        input.className = "input ing-input";
        input.value = value;
        input.placeholder = index === 0 ? "הוסף מצרך ראשון" : "הוסף מצרך נוסף";

        input.oninput = (e) => {
          groceryList[index] = e.target.value;
          autoResize(e.target);
          if (
            index === groceryList.length - 1 &&
            e.target.value.trim() !== ""
          ) {
            groceryList.push("");
            createIngredientInput(groceryList.length - 1, "");
          }
        };

        input.onkeydown = (e) => {
          if (e.key === "Enter" || e.key === "Tab") {
            if (e.key === "Enter") e.preventDefault();
            const allInputs = container.querySelectorAll(".ing-input");
            if (allInputs[index + 1]) {
              allInputs[index + 1].focus();
            }
          }
        };

        input.onblur = (e) => {
          const val = e.target.value.trim();
          groceryList[index] = val;
          if (
            val === "" &&
            index !== groceryList.length - 1 &&
            groceryList.length > 1
          ) {
            groceryList.splice(index, 1);
            renderIngredients();
          }
        };

        container.appendChild(input);
      }

      function autoResize(el) {
        // מאפסים את הגובה כדי למדוד מחדש בצורה מדויקת (במקרה של מחיקת טקסט)
        el.style.height = "auto";
        // מגדירים את הגובה לפי גובה התוכן
        el.style.height = el.scrollHeight + "px";
      }
    </script>
  </body>
</html>
