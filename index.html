<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="manifest" href="manifest.json" />
    <title>Recipeme!</title>
    <style>
      * {
        -webkit-touch-callout: none; /* מבטל את תפריט הלחיצה הארוכה ב-iOS */
        touch-action: manipulation;
      }
      :root {
        /* רקע פסטלי עדין: צהבהב שגולש לתכלת וסגול בהיר */
        --bg-gradient: linear-gradient(
          135deg,
          #fef9c3 0%,
          #e0f2fe 50%,
          #f3e8ff 100%
        );

        /* כפתורים בצבעי ירוק-כחול רגועים במקום כתום מנקר עיניים */
        --btn-gradient: linear-gradient(135deg, #6ee7b7 0%, #3b82f6 100%);
        --btn-hover-gradient: linear-gradient(135deg, #3b82f6 0%, #6ee7b7 100%);

        --blue-accent: #6366f1; /* סגול-כחול עדין לכותרות */
        --text-main: #334155;
        --container-bg: rgba(255, 255, 255, 0.85);

        /* אינפוטים לקריאה בלבד */
        --readonly-bg: #f8fafc;
        --readonly-text: #475569;
        --readonly-border: #e2e8f0;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        background: var(--bg-gradient);
        background-attachment: fixed;
        min-height: 100dvh;
        color: var(--text-main);
        overflow-x: hidden;
        /* display: flex; */
        user-select: none; /* מונע בחירת טקסט בכל האתר */
        -webkit-user-select: none;
        -webkit-user-select: none; /* ספארי ודפדפני iOS */
        -ms-user-select: none; /* אינטרנט אקספלורר / אדג' ישן */
        user-select: none; /* כרום, פיירפוקס ואדג' חדש */
        overflow-x: hidden; /* מונע קפיצות רוחב בגלל אלמנטים שיוצאים מהמסך */
        position: relative;
        display: block;
      }

      /* קונטיינר מרכזי - עם מרווחים מהצדדים ולמטה */
      .page-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 85%;
        max-width: 500px;
        margin: 2rem auto 2rem auto; /* מרווח מלמעלה ומלמטה */
        padding: 1.5rem;
        background-color: var(--container-bg);
        backdrop-filter: blur(8px);
        border-radius: 1.2rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.5);
        text-align: center;
        box-sizing: border-box;
        position: relative;
      }

      /* כפתורים */
      .button {
        height: 3rem;
        width: 100%;
        background: var(--btn-gradient);
        color: #fff;
        border-radius: 0.75rem;
        font-size: 1.2rem;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        margin: 0.5rem 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        position: relative; /* לתיקון לחיצות */
        z-index: 10;
      }

      .button:hover,
      .button:active {
        transform: scale(1.02);
        box-shadow: 0 4px 12px rgba(253, 160, 133, 0.4);
      }

      /* אינפוטים */
      .input,
      .textarea {
        width: 100%;
        padding: 0.75rem 1rem;
        margin: 0.5rem 0;
        border: 1px solid #cbd5e1;
        border-radius: 0.75rem;
        font-size: 16px;
        background: #fff;
        box-sizing: border-box;
        outline: none;
        transition: all 0.3s ease;
        user-select: auto; /* מאפשר סימון טקסט בתוך אינפוטים */
        -webkit-user-select: auto;
        font-family: inherit;
        -webkit-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }

      .input:focus,
      .textarea:focus {
        border-color: var(--blue-accent);
        background: #f0f9ff; /* הופך לתכלת עדין */
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      .textarea {
        min-height: 120px;
        resize: none;
        overflow: hidden; /* מבטל את הגלילה הפנימית */
        transition: height 0.1s ease; /* אנימציה עדינה להגדלה */
        line-height: 1.5;
      }

      /* אינפוטים של קריאה בלבד (דף מתכון) */
      .readonly-box {
        background-color: var(--readonly-bg);
        color: var(--readonly-text);
        border: 1px solid var(--readonly-border);
        pointer-events: none; /* חוסם לחיצה/פוקוס */
        text-align: right;
      }

      #ingredients-list {
        display: flex;
        flex-direction: column;
        width: 100%;
        margin: 5px 0;
      }

      #display-ingredients {
        width: 100%;
        padding: 0;
        margin: 0.5rem 0;
        list-style: none; /* מבטל את הנקודות הרגילות אם תרצה */
        text-align: right; /* מצמיד טקסט לימין */
        direction: rtl; /* מבטיח כיוון עברית */
      }

      #display-ingredients li {
        margin-bottom: 0.5rem;
        padding: 0.4rem 0;
        display: block; /* גורם לכל מצרך לתפוס שורה מלאה כמו אינפוט */
        box-sizing: border-box;
      }

      #display-ingredients li::before {
        content: "🔪 ";
        margin-left: 8px;
      }

      .label {
        width: 100%;
        text-align: right;
        font-weight: 600;
        color: var(--blue-accent);
        margin-top: 0.8rem;
        font-size: 1.1rem;
      }

      /* --- דף הבית --- */
      #view-home {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 5vh;
      }

      .logo-home {
        width: 250px;
        height: 250px;
        margin: 5dvh auto 20dvh auto;
        border-radius: 50%;
        object-fit: cover;
        /* box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); */
        /* אם אין תמונה, מציג עיגול אפור יפה כפלייסחולדר */
        /* background-color: #e2e8f0; */
      }

      .search-group {
        display: flex;
        width: 85%;
        max-width: 500px;
        height: 3.5rem;
        margin-bottom: 1.5rem;
        border: 2px solid #93c5fd;
        border-radius: 0.75rem;
        overflow: hidden;
        background: #fff;
        transition: all 0.3s ease;
      }

      .search-group:focus-within {
        border-color: var(--blue-accent);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      .search-input {
        flex: 4;
        border: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        height: 100%;
      }

      .search-input:focus {
        outline: none;
        background-color: #fbfdff;
      }

      .search-button {
        flex: 1;
        border: none !important;
        border-right: 1px solid #bfdbfe;
        border-radius: 0 !important;
        margin: 0 !important;
        height: 100%;
        background: #eff6ff;
        color: var(--blue-accent);
      }

      /* --- אנימציית טקסט רץ (Marquee) עם השהייה של 2 שניות --- */
      .marquee-container {
        width: calc(100% - 20px);
        overflow: hidden;
        white-space: nowrap;
        position: relative;
        padding: 0 10px;
      }

      .marquee-text {
        display: inline-block;
        animation: marquee 7s linear infinite;
        animation-delay: 2s; /* מחכה 2 שניות לפני שמתחיל */
      }

      @keyframes marquee {
        0%,
        10% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(100%);
        }
      }

      /* --- הודעות קופצות (Toast) --- */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 2rem;
        transform: translate(-50%, 50px);
        background: rgba(15, 23, 42, 0.9);
        color: #fff;
        padding: 0.8rem 1.5rem;
        border-radius: 2rem;
        font-weight: 500;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        z-index: 9999;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* חלון מחיקה */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(3px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .modal-overlay.active {
        display: flex;
        opacity: 1;
      }
      .modal-content {
        background: white;
        padding: 25px;
        border-radius: 12px;
        width: 85%;
        max-width: 320px;
        text-align: center;
        transform: scale(0.9);
        transition: transform 0.3s ease;
      }
      .modal-overlay.active .modal-content {
        transform: scale(1);
      }

      /* --- דף טעינה עם אנימציה --- */
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100dvh;
      }
      .cooking-pot {
        width: 60px;
        height: 40px;
        background: #475569;
        border-radius: 0 0 20px 20px;
        position: relative;
        animation: bouncePot 1s infinite alternate;
      }
      .cooking-pot::before {
        content: "";
        position: absolute;
        top: -10px;
        left: 10px;
        width: 40px;
        height: 10px;
        background: #94a3b8;
        border-radius: 50%;
      }
      .cooking-pot::after {
        content: "";
        position: absolute;
        top: 10px;
        right: -25px;
        width: 30px;
        height: 8px;
        background: #475569;
        border-radius: 10px;
        transform: rotate(20deg);
      }
      @keyframes bouncePot {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-10px);
        }
      }
      .loader-text {
        margin-top: 1.5rem;
        color: var(--blue-accent);
        font-weight: bold;
        font-size: 1.2rem;
      }

      /* --- תצוגות (Views) - מעברי שקיפות (Fade) --- */
      .view {
        display: none;
        opacity: 0;
        width: 100%;
        min-height: 100dvh;
        transition: opacity 0.3s ease-out; /* הוחלף מ-2 שניות ל-0.3 */
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        margin-left: auto;
        margin-right: auto;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
        z-index: 1;
      }

      .view.active {
        display: flex;
        opacity: 1;
        pointer-events: auto;
        z-index: 2;
        position: relative;
      }

      .view.fading-out {
        display: flex;
        opacity: 0;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="toast">הודעה</div>

    <div id="delete-modal" class="modal-overlay" onclick="closeDeleteModal()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <h3 style="color: #ef4444; margin-top: 0">מחיקת מתכון</h3>
        <p>האם למחוק את המתכון לצמיתות?</p>
        <div style="display: flex; gap: 15px; margin-top: 20px">
          <button
            class="button"
            style="background: #ef4444"
            id="confirm-delete-btn"
          >
            כן, מחק
          </button>
          <button
            class="button"
            style="background: #94a3b8"
            onclick="closeDeleteModal()"
          >
            ביטול
          </button>
        </div>
      </div>
    </div>

    <div id="view-loading" class="view">
      <div class="loader-container">
        <div class="cooking-pot"></div>
        <div class="loader-text"></div>
      </div>
    </div>

    <div id="view-home" class="view active">
      <img
        src="icon.png"
        class="logo-home"
        alt="Logo"
        onerror="this.style.display = 'none'"
      />

      <div class="search-group">
        <input
          type="text"
          id="search-input"
          class="input search-input"
          placeholder="חפש מתכון..."
        />
        <button
          class="button search-button"
          onclick="
            searchRecipes(document.getElementById('search-input').value.trim());
            setTimeout(() => {
              document.getElementById('search-input').value = '';
            }, 750);
          "
        >
          🔍
        </button>
      </div>

      <button
        class="button"
        style="width: 85%; max-width: 500px"
        onclick="
          resetAddForm();
          navigateTo('view-add', false);
        "
      >
        הוספת מתכון חדש
      </button>
    </div>

    <div id="view-search" class="view">
      <div class="page-container">
        <h2 style="color: var(--blue-accent)">תוצאות חיפוש</h2>
        <div id="search-results" style="width: 100%"></div>
      </div>
    </div>

    <div id="view-add" class="view">
      <div class="page-container">
        <h2 class="label" style="text-align: center; font-size: 1.5rem">
          הוספת מתכון חדש
        </h2>

        <div class="label">שם המתכון</div>
        <input
          type="text"
          id="recipe-name"
          class="input"
          placeholder="למשל: עוגת שוקולד"
        />

        <div class="label">מצרכים</div>
        <div id="ingredients-list"></div>

        <div class="label">אופן ההכנה</div>
        <textarea
          id="recipe-method"
          class="textarea"
          placeholder="איך מכינים?"
          oninput="autoResize(this)"
        ></textarea>

        <button class="button" id="save-btn" onclick="saveRecipe()">
          שמור מתכון
        </button>
      </div>
    </div>

    <div id="view-recipe" class="view">
      <div class="page-container">
        <h1
          id="display-name"
          style="
            color: var(--blue-accent);
            text-align: center;
            width: 100%;
            margin-top: 0;
          "
        ></h1>

        <div class="label">מצרכים</div>
        <ul id="display-ingredients"></ul>

        <div class="label">אופן ההכנה</div>
        <textarea
          id="display-method"
          class="textarea readonly-box"
          readonly
        ></textarea>

        <button
          class="button"
          style="background: #ef4444; margin-top: 1.5rem"
          onclick="askDeleteRecipe()"
        >
          מחיקת מתכון
        </button>
      </div>
    </div>

    <script>
      // ⚠️ החלף את הלינק הזה ללינק החדש של השרת שלך לאחר העדכון! ⚠️
      const API_URL =
        "https://script.google.com/macros/s/AKfycbyg7jQ1hnPkzT-yBVJfUbluXyMToMvS06ezUNXHM985po1PyiVccNKf3oeMSDLsxdIT/exec";

      const CACHE_KEY = "recipeme_data";

      let cachedRecipes = [];
      let currentRecipeName = "";
      let groceryList = [""];

      /* --- ניהול הזיכרון המקומי (Local Storage) --- */
      function loadFromCache() {
        try {
          const data = localStorage.getItem(CACHE_KEY);
          if (data) cachedRecipes = JSON.parse(data);
        } catch (e) {
          console.error("שגיאה בקריאה מהזיכרון המקומי", e);
        }
      }

      function saveToCache() {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify(cachedRecipes));
        } catch (e) {
          console.warn("Local storage full", e);
          showToast(
            "אזהרה: זיכרון הדפדפן מלא. המתכון נשמר בענן אך לא יהיה זמין באופליין.",
          );
        }
      }

      /* --- סנכרון ברקע בעליית האתר --- */
      async function backgroundSync() {
        try {
          const res = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "getAllRecipes" }),
          });
          const result = await res.json();
          if (result.status === "success") {
            cachedRecipes = result.data;
            saveToCache();
          }
        } catch (e) {
          console.log("סנכרון רקע נכשל - משתמשים בנתונים הקיימים (אופליין)");
        }
      }

      window.onload = () => {
        loadFromCache(); // 1. טעינה מיידית מהזיכרון
        backgroundSync(); // 2. סנכרון שקט ברקע בלי לעצור את המשתמש

        navigateTo("view-home", true);

        const searchInput = document.getElementById("search-input");
        if (searchInput) {
          searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              searchRecipesLocal(searchInput.value);
              searchInput.value = "";
            }
          });
        }
      };

      window.onpopstate = (e) => {
        if (
          document.getElementById("delete-modal").classList.contains("active")
        ) {
          closeDeleteModal();
          return;
        }
        if (e.state && e.state.view) switchViewElement(e.state.view);
        else switchViewElement("view-home");
      };

      function navigateTo(viewId, replace = false) {
        if (replace)
          history.replaceState(
            { view: viewId },
            "",
            `#${viewId.replace("view-", "")}`,
          );
        else
          history.pushState(
            { view: viewId },
            "",
            `#${viewId.replace("view-", "")}`,
          );
        switchViewElement(viewId);
      }

      function resetAddForm() {
        document.getElementById("recipe-name").value = "";
        document.getElementById("recipe-method").value = "";
        document.getElementById("recipe-method").style.height = "auto";
        groceryList = [""];
        renderIngredients();
      }

      function switchViewElement(viewId) {
        const currentView = document.querySelector(".view.active");
        const nextView = document.getElementById(viewId);

        if (currentView && currentView.id !== viewId) {
          currentView.classList.add("fading-out");
          currentView.classList.remove("active");
          // מעבר מהיר יותר - 300 מילישניות
          setTimeout(() => {
            currentView.classList.remove("fading-out");
            currentView.style.display = "none";
            showNextView(nextView, viewId);
          }, 300);
        } else {
          showNextView(nextView, viewId);
        }
      }

      function showNextView(nextView, viewId) {
        nextView.style.display = "flex";
        void nextView.offsetWidth;
        nextView.classList.add("active");
        window.scrollTo(0, 0);
        if (viewId === "view-recipe") {
          setTimeout(
            () => autoResize(document.getElementById("display-method")),
            50,
          );
        }
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 3000);
      }

      function createMarqueeText(text) {
        return text.length > 20
          ? `<div class="marquee-container"><span class="marquee-text">${text}</span></div>`
          : text;
      }

      /* --- חיפוש מקומי (מיידי) --- */
      function searchRecipesLocal(query) {
        const term = query.trim();
        let results = cachedRecipes;

        if (term) {
          results = cachedRecipes.filter((r) => r.name.includes(term));
          // מיון לפי רלוונטיות
          results.sort((a, b) => a.name.indexOf(term) - b.name.indexOf(term));
        }

        const list = document.getElementById("search-results");
        list.innerHTML = "";

        if (results.length === 0) {
          list.innerHTML = "<p style='color: #64748b;'>לא נמצאו מתכונים</p>";
        } else {
          results.forEach((recipe) => {
            const b = document.createElement("button");
            b.className = "button";
            b.innerHTML = createMarqueeText(recipe.name);
            b.onclick = () => {
              renderRecipeData(recipe);
              navigateTo("view-recipe", false);
            };
            list.appendChild(b);
          });
        }
        navigateTo("view-search", false);
      }

      // מעטפת לכפתור החיפוש בהטמאל
      function searchRecipes(query) {
        searchRecipesLocal(query);
      }

      function renderRecipeData(recipe) {
        currentRecipeName = recipe.name;
        document.getElementById("display-name").innerHTML = createMarqueeText(
          recipe.name,
        );
        document.getElementById("display-ingredients").innerHTML =
          recipe.ingredients.map((i) => `<li>${i}</li>`).join("");
        document.getElementById("display-method").value = recipe.method;
      }

      /* --- שמירה אופטימית --- */
      async function saveRecipe() {
        const name = document.getElementById("recipe-name").value.trim();
        const method = document.getElementById("recipe-method").value.trim();
        const ingredients = groceryList.filter((item) => item.trim() !== "");

        if (!name || !method || ingredients.length === 0) {
          showToast("חובה למלא שם, מצרכים ואופן הכנה");
          return;
        }

        const newRecipe = { name, ingredients, method };
        const saveBtn = document.getElementById("save-btn");
        saveBtn.disabled = true;

        // 1. ממשק אופטימי - שמירה בזיכרון ומעבר מיידי לדף המתכון!
        cachedRecipes.unshift(newRecipe); // מוסיף לתחילת המערך
        saveToCache();

        showToast("המתכון נשמר בהצלחה!");
        renderRecipeData(newRecipe);
        navigateTo("view-recipe", true);
        saveBtn.disabled = false;

        // 2. סנכרון שקט ברקע מול השרת
        try {
          const response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "addRecipe", recipe: newRecipe }),
          });
          const result = await response.json();

          if (result.status !== "success") throw new Error(result.message);
        } catch (error) {
          // מחיקה מהזיכרון הקאש במקרה של כישלון בשרת
          cachedRecipes = cachedRecipes.filter((r) => r.name !== name);
          saveToCache();
          showToast("שגיאה בסנכרון לענן: " + (error.message || "בעיית תקשורת"));
        }
      }

      /* --- מחיקה אופטימית --- */
      function askDeleteRecipe() {
        document.getElementById("delete-modal").classList.add("active");
      }

      function closeDeleteModal() {
        document.getElementById("delete-modal").classList.remove("active");
      }

      document.getElementById("confirm-delete-btn").onclick = async () => {
        closeDeleteModal();

        const nameToDelete = currentRecipeName;

        // 1. גיבוי לפני מחיקה (למקרה של שגיאה) ומחיקה מהירה
        const recipeIndex = cachedRecipes.findIndex(
          (r) => r.name === nameToDelete,
        );
        const backupRecipe = cachedRecipes[recipeIndex];

        cachedRecipes.splice(recipeIndex, 1);
        saveToCache();

        showToast("המתכון נמחק");
        navigateTo("view-home", true);

        // 2. מחיקה שקטה ברקע מול השרת
        try {
          const res = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "deleteRecipe",
              name: nameToDelete,
            }),
          });
          const result = await res.json();
          if (result.status !== "success") throw new Error(result.message);
        } catch (e) {
          // שחזור המתכון אם השרת סירב
          if (backupRecipe) {
            cachedRecipes.splice(recipeIndex, 0, backupRecipe);
            saveToCache();
          }
          showToast("שגיאה במחיקה מהענן. המתכון שוחזר.");
        }
      };

      /* --- ניהול מצרכים --- */
      function renderIngredients() {
        const container = document.getElementById("ingredients-list");
        container.innerHTML = "";
        groceryList.forEach((item, index) =>
          createIngredientInput(index, item),
        );
      }

      function createIngredientInput(index, value) {
        const container = document.getElementById("ingredients-list");
        const input = document.createElement("input");
        input.type = "text";
        input.className = "input ing-input";
        input.value = value;
        input.placeholder = index === 0 ? "הוסף מצרך ראשון" : "הוסף מצרך נוסף";

        input.oninput = (e) => {
          groceryList[index] = e.target.value;
          autoResize(e.target);
          if (
            index === groceryList.length - 1 &&
            e.target.value.trim() !== ""
          ) {
            groceryList.push("");
            createIngredientInput(groceryList.length - 1, "");
          }
        };

        input.onkeydown = (e) => {
          if (e.key === "Enter" || e.key === "Tab") {
            if (e.key === "Enter") e.preventDefault();
            const allInputs = container.querySelectorAll(".ing-input");
            if (allInputs[index + 1]) allInputs[index + 1].focus();
          }
        };

        input.onblur = (e) => {
          const val = e.target.value.trim();
          groceryList[index] = val;
          if (
            val === "" &&
            index !== groceryList.length - 1 &&
            groceryList.length > 1
          ) {
            groceryList.splice(index, 1);
            renderIngredients();
          }
        };

        container.appendChild(input);
      }

      function autoResize(el) {
        el.style.height = "auto";
        el.style.height = el.scrollHeight + "px";
      }

      document.addEventListener(
        "touchstart",
        function (event) {
          if (event.touches.length > 1) event.preventDefault();
        },
        { passive: false },
      );

      let lastTouchEnd = 0;
      document.addEventListener(
        "touchend",
        function (event) {
          const now = new Date().getTime();
          if (now - lastTouchEnd <= 300) event.preventDefault();
          lastTouchEnd = now;
        },
        false,
      );
    </script>

    <script>
      // רישום Service Worker להתקנת האפליקציה
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(function (error) {
          console.log("Service worker registration failed:", error);
        });
      }
    </script>
  </body>
</html>
